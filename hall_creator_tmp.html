<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>会場登録 v1.0</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #222;
      --accent-contrast: #fff;
      --accent-soft: #f0f0f2;
      --bg: #f5f5f7;
      --card: #fff;
      --text: #222;
      --muted: #6b6b70;
      --border: #dddddf;
      --danger: #b42318;
    }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      width: min(100%, 880px);
      margin: 0 auto;
    }

    h1, h2, h3 { line-height: 1.3; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    h3 { margin: 0; font-size: 17px; }

    .note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      margin-bottom: 14px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .area-card {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fafafa;
    }

    .area-head, .rule-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .area-head { margin-bottom: 12px; }

    .rule-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .rule-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      margin-top: 8px;
    }

    .aisle-row {
      grid-template-columns: minmax(0, 1fr) minmax(90px, .6fr) minmax(90px, .6fr) auto;
    }

    @media (max-width: 680px) {
      .rule-row, .aisle-row { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      min-height: 44px;
      margin-top: 5px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font: inherit;
      font-size: 16px;
    }

    textarea {
      min-height: 270px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .run {
      width: 100%;
      margin-top: 14px;
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 16px;
    }

    .sub {
      background: var(--card);
      color: var(--text);
      border: 1px solid #ccc;
    }

    .small {
      min-height: 38px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .danger {
      color: var(--danger);
      border-color: #e4b9b4;
    }

    .hint {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .error {
      margin-top: 10px;
      color: var(--danger);
      font-weight: 700;
    }

    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, white);
      font-size: 13px;
    }

    [hidden] { display: none !important; }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --card: #1b1b1d;
        --text: #f4f4f4;
        --muted: #aaa;
        --border: #38383c;
        --accent-soft: #2a2a2d;
      }

      .area-card { background: #202022; }

      input, textarea {
        background: #222;
        color: #fff;
        border-color: #555;
      }

      .sub {
        background: var(--card);
        color: var(--text);
        border-color: #555;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>会場登録</h1>
    <p class="note">
      座席発券シミュレーター用の会場データを作成します。
      エリア・座席・通路・存在しない席は何件でも追加できます。
    </p>

    <section class="card">
      <h2>会場情報</h2>

      <label>
        会場名
        <input id="hallName" type="text" value="サンプルホール" placeholder="例：東京○○ホール">
      </label>

      <div class="actions">
        <button id="addArea" class="sub" type="button">＋ エリアを追加</button>
        <button id="loadSample" class="sub" type="button">サンプルに戻す</button>
      </div>
    </section>

    <section class="card">
      <div class="area-head">
        <h2 style="margin:0;">座席設定</h2>
        <span class="hint">1階席・2階席・アリーナなど</span>
      </div>

      <div id="areas"></div>
      <div id="formError" class="error"></div>
    </section>

    <section class="card">
      <h2>Markdownプレビュー</h2>

      <textarea id="preview" readonly aria-label="Markdownプレビュー"></textarea>

      <button id="downloadMd" class="run" type="button">.mdファイルを書き出す</button>

      <div class="actions">
        <button id="copyMd" class="sub" type="button">Markdownをコピー</button>
      </div>

      <div id="status" class="status" hidden></div>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const $ = id => document.getElementById(id);

      function makeButton(label, className, handler) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.addEventListener("click", handler);
        return button;
      }

      function makeInput(labelText, value = "", placeholder = "") {
        const label = document.createElement("label");
        label.textContent = labelText;

        const input = document.createElement("input");
        input.type = "text";
        input.value = value;
        input.placeholder = placeholder;
        input.addEventListener("input", updatePreview);

        label.appendChild(input);
        return { label, input };
      }

      function addSeatRule(container, values = {}) {
        const row = document.createElement("div");
        row.className = "rule-row seat-rule";

        const rows = makeInput("列", values.rows ?? "A-Z", "A-Z / 1-20 / A,B,C");
        const seats = makeInput("番号", values.seats ?? "1-30", "1-30 / 1,3,5");

        const remove = makeButton("削除", "sub small danger", () => {
          row.remove();
          updatePreview();
        });

        row.append(rows.label, seats.label, remove);
        container.appendChild(row);
      }

      function addExcludeRule(container, values = {}) {
        const row = document.createElement("div");
        row.className = "rule-row exclude-rule";

        const rows = makeInput("列", values.rows ?? "A-Z", "A-Z / A,B,C");
        const seats = makeInput("除外する番号", values.seats ?? "10", "10 / 10,20");

        const remove = makeButton("削除", "sub small danger", () => {
          row.remove();
          updatePreview();
        });

        row.append(rows.label, seats.label, remove);
        container.appendChild(row);
      }

      function addAisleRule(container, values = {}) {
        const row = document.createElement("div");
        row.className = "rule-row aisle-row aisle-rule";
 const rows = makeInput("適用する列", values.rows ?? "A-Z", "A-Z / 1-18");
        const left = makeInput("左の席", values.left ?? "9", "9");
        const right = makeInput("右の席", values.right ?? "10", "10");

        let rightWasEdited = values.right !== undefined;

        left.input.addEventListener("input", () => {
          if (!rightWasEdited) {
            const number = Number(left.input.value);
            right.input.value =
              Number.isFinite(number) && left.input.value !== ""
                ? String(number + 1)
                : "";
          }
          updatePreview();
        });

        right.input.addEventListener("input", () => {
          rightWasEdited = true;
          updatePreview();
        });

        const remove = makeButton("削除", "sub small danger", () => {
          row.remove();
          updatePreview();
        });

        row.append(rows.label, left.label, right.label, remove);
        container.appendChild(row);
      }

      function createRuleSection(title, addLabel, type) {
        const section = document.createElement("div");
        section.className = "rule-section";
        section.dataset.type = type;

        const head = document.createElement("div");
        head.className = "rule-head";

        const heading = document.createElement("h3");
        heading.textContent = title;

        const list = document.createElement("div");
        list.className = "rule-list";

        const addButton = makeButton(addLabel, "sub small", () => {
          if (type === "seat") addSeatRule(list);
          if (type === "aisle") addAisleRule(list);
          if (type === "exclude") addExcludeRule(list);
          updatePreview();
        });

        head.append(heading, addButton);
        section.append(head, list);

        return { section, list };
      }

      function addArea(values = {}) {
        const area = document.createElement("div");
        area.className = "area-card";

        const head = document.createElement("div");
        head.className = "area-head";

        const areaName = makeInput(
          "エリア名",
          values.name ?? "1階席",
          "1階席 / 2階席 / アリーナ"
        );
        areaName.label.style.flex = "1";

        const removeArea = makeButton("エリア削除", "sub small danger", () => {
          area.remove();
          updatePreview();
        });

        head.append(areaName.label, removeArea);

        const front = makeInput(
          "最前として扱う列",
          values.front ?? "A",
          "A / 1 / A,B"
        );
        front.label.className = "front-field";
        front.label.style.marginTop = "8px";

        const seatSection = createRuleSection("座席", "＋ 座席", "seat");
        const aisleSection = createRuleSection("通路", "＋ 通路", "aisle");
        const excludeSection = createRuleSection(
          "存在しない席",
          "＋ 存在しない席",
          "exclude"
        );

        area.append(
          head,
          front.label,
          seatSection.section,
          aisleSection.section,
          excludeSection.section
        );

        $("areas").appendChild(area);

        (values.seats ?? [{ rows: "A-Z", seats: "1-30" }])
          .forEach(rule => addSeatRule(seatSection.list, rule));

        (values.aisles ?? [])
          .forEach(rule => addAisleRule(aisleSection.list, rule));

        (values.excludes ?? [])
          .forEach(rule => addExcludeRule(excludeSection.list, rule));

        updatePreview();
      }

      function buildMarkdown() {
        const hallName = $("hallName").value.trim() || "名称未設定";
        const areaElements = [...$("areas").querySelectorAll(".area-card")];

        if (areaElements.length === 0) {
          throw new Error("エリアを1つ以上追加してください。");
        }

        const lines = [`# ${hallName}`, ""];

        for (const area of areaElements) {
          const areaName = area.querySelector(".area-head input").value.trim();

          if (!areaName) {
            throw new Error("エリア名を入力してください。");
          }

          lines.push(`## エリア: ${areaName}`);

          const seatRows = [...area.querySelectorAll(".seat-rule")];

          if (seatRows.length === 0) {
            throw new Error(`${areaName}に座席がありません。`);
          }

          for (const row of seatRows) {
            const inputs = row.querySelectorAll("input");
            const rows = inputs[0].value.trim();
            const seats = inputs[1].value.trim();

            if (!rows || !seats) {
              throw new Error(`${areaName}の座席に空欄があります。`);
            }

            lines.push(`座席: ${rows} | ${seats}`);
          }

          for (const row of area.querySelectorAll(".exclude-rule")) {
            const inputs = row.querySelectorAll("input");
            const rows = inputs[0].value.trim();
            const seats = inputs[1].value.trim();

            if (!rows && !seats) continue;
            if (!rows || !seats) {
              throw new Error(`${areaName}の存在しない席に空欄があります。`);
            }

            lines.push(`除外: ${rows} | ${seats}`);
          }

          for (const row of area.querySelectorAll(".aisle-rule")) {
            const inputs = row.querySelectorAll("input");
            const rows = inputs[0].value.trim();
            const left = inputs[1].value.trim();
            const right = inputs[2].value.trim();

            if (!rows && !left && !right) continue;
            if (!rows || !left || !right) {
              throw new Error(`${areaName}の通路に空欄があります。`);
            }

            lines.push(`通路: ${rows} | ${left}>${right}`);
          }

          const front = area.querySelector(".front-field input").value.trim();

          if (front) {
            lines.push(`最前: ${front}`);
          }

          lines.push("");
        }

        return lines.join("\n").trimEnd() + "\n";
      }

      function updatePreview() {
        $("formError").textContent = "";

        try {
          $("preview").value = buildMarkdown();
        } catch (error) {
          $("preview").value = "";
          $("formError").textContent =
            error instanceof Error ? error.message : "入力内容を確認してください。";
        }
      }

      function safeFilename(name) {
        const cleaned = name
          .trim()
          .replace(/[\\/:*?"<>|]/g, "_")
          .replace(/\s+/g, "_");

        return cleaned || "hall";
      }

      function downloadMarkdown() {
        $("formError").textContent = "";

        try {
          const markdown = buildMarkdown();
          const blob = new Blob([markdown], {
            type: "text/markdown;charset=utf-8"
          });

          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");

          anchor.href = url;
          anchor.download = `${safeFilename($("hallName").value)}.md`;

          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);

          showStatus("Markdownファイルを書き出しました。");
        } catch (error) {
          $("formError").textContent =
            error instanceof Error ? error.message : "書き出しに失敗しました。";
        }
      }

      async function copyMarkdown() {
        try {
          const markdown = buildMarkdown();

          try {
            await navigator.clipboard.writeText(markdown);
          } catch {
            $("preview").focus();
            $("preview").select();
            document.execCommand("copy");
          }

          showStatus("Markdownをコピーしました。");
        } catch (error) {
          $("formError").textContent =
            error instanceof Error ? error.message : "コピーに失敗しました。";
        }
      }

      function showStatus(message) {
        $("status").textContent = message;
        $("status").hidden = false;

        setTimeout(() => {
          $("status").hidden = true;
        }, 1600);
      }

      function loadSample() {
        $("hallName").value = "サンプルホール";
        $("areas").innerHTML = "";

        addArea({
          name: "1階席",
          front: "A",
          seats: [
            { rows: "A-H", seats: "1-26" },
            { rows: "I-R", seats: "1-30" }
          ],
          aisles: [
            { rows: "A-R", left: "9", right: "10" },
            { rows: "A-R", left: "19", right: "20" }
          ],
          excludes: []
        });

        addArea({
          name: "2階席",
          front: "A",
          seats: [
            { rows: "A-F", seats: "1-24" }
          ],
          aisles: [
            { rows: "A-F", left: "12", right: "13" }
          ],
          excludes: []
        });

        updatePreview();
      }

      $("hallName").addEventListener("input", updatePreview);

      $("addArea").addEventListener("click", () => {
        addArea({
          name: `エリア${$("areas").children.length + 1}`,
          front: "",
          seats: [{ rows: "A-Z", seats: "1-30" }],
          aisles: [],
          excludes: []
        });
      });

      $("loadSample").addEventListener("click", loadSample);
      $("downloadMd").addEventListener("click", downloadMarkdown);
      $("copyMd").addEventListener("click", copyMarkdown);

      loadSample();
    })();
  </script>
</body>
</html>
